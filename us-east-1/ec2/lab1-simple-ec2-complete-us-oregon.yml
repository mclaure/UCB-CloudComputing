AWSTemplateFormatVersion: "2010-09-09"
Description: "Free-Tier Eligible: Simple EC2 in Default VPC"

Parameters:

  LatestAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: "/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64"
    Description: "Free-tier eligible Amazon Linux 2023 AMI"

  DefaultVPC:
    Type: AWS::EC2::VPC::Id
    Default: vpc-0aa43b998b6010b81
    Description: "Default VPC ID"

  DefaultSubnet:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-0a9f77585755d21ba
    Description: "Default Subnet ID"

Resources:

  SimpleEC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Allow SSH (free tier test)"
      VpcId: !Ref DefaultVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 1433
          ToPort: 1433
          CidrIp: 0.0.0.0/0          

  SimpleEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro       # FREE TIER
      ImageId: !Ref LatestAmi
      SecurityGroupIds:
        - !Ref SimpleEC2SecurityGroup
      SubnetId: !Ref DefaultSubnet
      Tags:
        - Key: Name
          Value: FreeTierSimpleEC2

Outputs:
  InstanceID:
    Description: "EC2 Instance ID"
    Value: !Ref SimpleEC2Instance

  PublicIP:
    Description: "Public IP"
    Value: !GetAtt SimpleEC2Instance.PublicIp
